<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Arena - Tactical Battle</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --panel-bg: #161925;
      --accent-red: #ff2a5f;
      --accent-gold: #ffb703;
      --accent-blue: #00b4d8;
      --accent-green: #2ec4b6;
      --text-main: #f8f9fa;
      --text-dim: #a0aab8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: var(--accent-gold);
      margin-bottom: 15px;
      text-align: center;
      letter-spacing: 1px;
    }

    .main-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Modus-Auswahl */
    .mode-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      background: #232738;
      color: var(--text-main);
      border: 2px solid transparent;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover { background: #2f344a; }
    .btn.active { border-color: var(--accent-gold); background: #2f344a; }
    .btn-primary { background: var(--accent-red); color: white; }
    .btn-primary:hover { background: #e0204f; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Panel Styles */
    .panel {
      background: var(--panel-bg);
      border: 1px solid #282d40;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .setup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f111a;
      padding: 12px 16px;
      border-radius: 8px;
    }

    select {
      background: #232738;
      color: var(--text-main);
      border: 1px solid #3b425d;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* Arena Arena Grid */
    .arena-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .player-card {
      background: #11131d;
      border: 2px solid #282d40;
      border-radius: 10px;
      padding: 15px;
      position: relative;
      transition: all 0.3s ease;
    }

    .player-card.active-turn {
      border-color: var(--accent-gold);
      box-shadow: 0 0 15px rgba(255, 183, 3, 0.2);
    }

    .player-card.dead {
      opacity: 0.35;
      filter: grayscale(1);
    }

    .hp-bar-outer {
      background: #232738;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin: 8px 0;
    }

    .hp-bar-inner {
      background: var(--accent-green);
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }

    .shield-badge {
      color: var(--accent-blue);
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Würfel & Steuerung */
    .controls-panel {
      align-items: center;
      text-align: center;
    }

    .dice-group {
      display: flex;
      gap: 12px;
      margin: 10px 0;
    }

    .dice {
      width: 55px;
      height: 55px;
      background: #ffffff;
      color: #111111;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      border: 3px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }

    .dice.selected {
      border-color: var(--accent-gold);
      background: #fffae6;
      transform: translateY(-6px);
    }

    /* Fähigkeiten Grid */
    .abilities-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .ability-btn {
      background: #232738;
      border: 1px solid #3b425d;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 160px;
      font-size: 0.85rem;
    }

    .ability-btn span {
      font-size: 0.72rem;
      color: var(--accent-gold);
    }

    .ability-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Log Box */
    .battle-log {
      background: #08090d;
      border: 1px solid #1c2030;
      border-radius: 8px;
      padding: 12px;
      height: 120px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .log-line { margin-bottom: 4px; }
    .log-line.important { color: var(--text-main); font-weight: bold; }
  </style>
</head>
<body>

  <div class="main-container">
    <h1>🎲 Dice Arena 🎲</h1>

    <!-- Modus Auswahl -->
    <div class="mode-nav">
      <button id="nav-free" class="btn active" onclick="switchMode('free')">Freies Spiel</button>
      <button id="nav-camp" class="btn" onclick="switchMode('campaign')">Kampagne</button>
    </div>

    <!-- Lobby Panel -->
    <div id="panel-lobby" class="panel">
      <h3>Spieler konfigurieren</h3>
      <div id="lobby-players"></div>
      <button class="btn btn-primary" onclick="initFreeGame()">Spiel Starten</button>
    </div>

    <!-- Kampagne Panel -->
    <div id="panel-campaign" class="panel" style="display: none;">
      <h3>Kampagnen-Modus</h3>
      <p id="campaign-info">Level 1: Besiege den Goblin-Bot</p>
      <button class="btn btn-primary" onclick="initCampaignGame()">Level Starten</button>
    </div>

    <!-- Arena Panel -->
    <div id="panel-arena" class="panel" style="display: none;">
      <div id="arena-grid" class="arena-grid"></div>

      <!-- Steuerung -->
      <div class="panel controls-panel">
        <div id="turn-indicator" style="font-weight: 700;">-</div>

        <div class="dice-group" id="dice-group">
          <div class="dice">?</div>
          <div class="dice">?</div>
          <div class="dice">?</div>
          <div class="dice">?</div>
        </div>
        <small style="color: var(--text-dim);">Klicke Würfel an, um sie zum Nachwürfeln zu behalten.</small>

        <div style="display: flex; gap: 10px; margin-top: 5px;">
          <button id="btn-roll" class="btn" onclick="rollDice()">Würfeln (<span id="rolls-left">3</span>/3)</button>
          <button id="btn-end-turn" class="btn btn-primary" onclick="endTurn()" disabled>Zug Beenden</button>
        </div>

        <!-- Fähigkeiten -->
        <div style="margin-top: 10px; width: 100%;">
          <p style="font-size: 0.85rem; margin-bottom: 8px; color: var(--text-dim);">Aktion wählen:</p>
          <div class="abilities-grid">
            <button class="ability-btn" id="act-attack" onclick="castAbility('attack')" disabled>
              ⚔️ Angriff <span>Schaden = Würfelsumme</span>
            </button>
            <button class="ability-btn" id="act-heal" onclick="castAbility('heal')" disabled>
              💚 Heilung <span>Min. 2x Gerade Würfel</span>
            </button>
            <button class="ability-btn" id="act-shield" onclick="castAbility('shield')" disabled>
              🛡️ Schild <span>Min. 2x Ungerade Würfel</span>
            </button>
            <button class="ability-btn" id="act-ultimate" onclick="castAbility('ultimate')" disabled>
              ☄️ Meteor <span>Min. 3x Gleiche Würfel</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Log -->
      <div class="battle-log" id="battle-log"></div>
    </div>
  </div>

  <script>
    let currentMode = 'free';
    let campaignLevel = 1;
    let players = [];
    let activeIndex = 0;
    let rollsLeft = 3;
    let diceValues = [1, 1, 1, 1];
    let diceKept = [false, false, false, false];
    let actionDone = false;

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('nav-free').classList.toggle('active', mode === 'free');
      document.getElementById('nav-camp').classList.toggle('active', mode === 'campaign');
      document.getElementById('panel-lobby').style.display = mode === 'free' ? 'flex' : 'none';
      document.getElementById('panel-campaign').style.display = mode === 'campaign' ? 'flex' : 'none';
      document.getElementById('panel-arena').style.display = 'none';
    }

    function renderLobby() {
      const container = document.getElementById('lobby-players');
      container.innerHTML = '';
      for (let i = 1; i <= 4; i++) {
        container.innerHTML += `
          <div class="setup-row">
            <span>Spieler ${i}</span>
            <select id="p-type-${i}">
              <option value="human" ${i === 1 ? 'selected' : ''}>Mensch</option>
              <option value="bot" ${i > 1 ? 'selected' : ''}>Bot</option>
              <option value="none" ${i > 2 ? 'selected' : ''}>Deaktiviert</option>
            </select>
          </div>
        `;
      }
    }
    renderLobby();

    function initFreeGame() {
      players = [];
      for (let i = 1; i <= 4; i++) {
        const type = document.getElementById(`p-type-${i}`).value;
        if (type !== 'none') {
          players.push({ id: i, name: `Spieler ${i}`, type: type, hp: 50, maxHp: 50, shield: 0, isDead: false });
        }
      }
      if (players.length < 2) {
        alert("Bitte wähle mindestens 2 aktive Spieler aus!");
        return;
      }
      startBattle();
    }

    function initCampaignGame() {
      players = [{ id: 1, name: "Held (Du)", type: 'human', hp: 60, maxHp: 60, shield: 0, isDead: false }];
      if (campaignLevel === 1) {
        players.push({ id: 2, name: "Goblin Bot", type: 'bot', hp: 35, maxHp: 35, shield: 0, isDead: false });
      } else if (campaignLevel === 2) {
        players.push({ id: 2, name: "Ork Krieger", type: 'bot', hp: 50, maxHp: 50, shield: 0, isDead: false });
        players.push({ id: 3, name: "Schatten Bot", type: 'bot', hp: 30, maxHp: 30, shield: 0, isDead: false });
      } else {
        players.push({ id: 2, name: "Endboss Drache", type: 'bot', hp: 90, maxHp: 90, shield: 10, isDead: false });
      }
      startBattle();
    }

    function startBattle() {
      document.getElementById('panel-lobby').style.display = 'none';
      document.getElementById('panel-campaign').style.display = 'none';
      document.getElementById('panel-arena').style.display = 'flex';
      document.getElementById('battle-log').innerHTML = '';

      activeIndex = 0;
      writeLog("⚔️ **Der Kampf beginnt!**", true);
      updateArenaUI();
      beginTurn();
    }

    function beginTurn() {
      const p = players[activeIndex];
      if (p.isDead) {
        nextTurn();
        return;
      }

      rollsLeft = 3;
      diceKept = [false, false, false, false];
      actionDone = false;
      diceValues = [1, 1, 1, 1];

      renderDice();
      updateArenaUI();

      document.getElementById('turn-indicator').innerText = `${p.name} ist am Zug (${p.type === 'bot' ? 'Bot' : 'Mensch'})`;

      if (p.type === 'bot') {
        toggleControls(true);
        setTimeout(runBotLogic, 700);
      } else {
        toggleControls(false);
        document.getElementById('btn-end-turn').disabled = true;
      }
    }

    function rollDice() {
      if (rollsLeft <= 0 || actionDone) return;

      for (let i = 0; i < 4; i++) {
        if (!diceKept[i]) {
          diceValues[i] = Math.floor(Math.random() * 6) + 1;
        }
      }
      rollsLeft--;
      renderDice();
      evaluateAbilities();

      if (rollsLeft === 0) {
        document.getElementById('btn-roll').disabled = true;
      }
    }

    function toggleKeepDice(idx) {
      if (rollsLeft === 3 || rollsLeft === 0 || players[activeIndex].type === 'bot') return;
      diceKept[idx] = !diceKept[idx];
      renderDice();
    }

    function renderDice() {
      const group = document.getElementById('dice-group');
      group.innerHTML = '';
      diceValues.forEach((val, i) => {
        const d = document.createElement('div');
        d.className = `dice ${diceKept[i] ? 'selected' : ''}`;
        d.innerText = rollsLeft === 3 ? '?' : val;
        d.onclick = () => toggleKeepDice(i);
        group.appendChild(d);
      });
      document.getElementById('rolls-left').innerText = rollsLeft;
    }

    function evaluateAbilities() {
      if (rollsLeft === 3) return;

      const evens = diceValues.filter(v => v % 2 === 0).length;
      const odds = diceValues.filter(v => v % 2 !== 0).length;

      const counts = {};
      diceValues.forEach(v => counts[v] = (counts[v] || 0) + 1);
      const hasTriple = Object.values(counts).some(c => c >= 3);

      document.getElementById('act-attack').disabled = actionDone;
      document.getElementById('act-heal').disabled = actionDone || evens < 2;
      document.getElementById('act-shield').disabled = actionDone || odds < 2;
      document.getElementById('act-ultimate').disabled = actionDone || !hasTriple;
    }

    function castAbility(type) {
      if (actionDone) return;
      const attacker = players[activeIndex];
      actionDone = true;

      if (type === 'attack') {
        const targets = players.filter(p => !p.isDead && p.id !== attacker.id);
        targets.sort((a, b) => a.hp - b.hp);
        const target = targets[0];

        const dmg = diceValues.reduce((a, b) => a + b, 0);
        dealDamage(target, dmg);
        writeLog(`⚔️ ${attacker.name} fügt ${target.name} **${dmg} Schaden** zu!`);

      } else if (type === 'heal') {
        attacker.hp = Math.min(attacker.maxHp, attacker.hp + 15);
        writeLog(`💚 ${attacker.name} heilt sich um **15 HP**.`);

      } else if (type === 'shield') {
        attacker.shield += 12;
        writeLog(`🛡️ ${attacker.name} erhält **+12 Schild**.`);

      } else if (type === 'ultimate') {
        writeLog(`☄️ **METEOR!** ${attacker.name} trifft alle Gegner mit voller Wucht!`, true);
        players.forEach(p => {
          if (!p.isDead && p.id !== attacker.id) {
            dealDamage(p, 20);
          }
        });
      }

      updateArenaUI();
      disableAbilities();
      document.getElementById('btn-end-turn').disabled = false;
    }

    function dealDamage(target, dmg) {
      if (target.shield > 0) {
        if (target.shield >= dmg) {
          target.shield -= dmg;
          dmg = 0;
        } else {
          dmg -= target.shield;
          target.shield = 0;
        }
      }
      target.hp -= dmg;
      if (target.hp <= 0) {
        target.hp = 0;
        target.isDead = true;
        writeLog(`💀 **${target.name} wurde eliminiert!**`, true);
      }
    }

    function endTurn() {
      if (checkWinner()) return;
      
      do {
        activeIndex = (activeIndex + 1) % players.length;
      } while (players[activeIndex].isDead);

      beginTurn();
    }

    function runBotLogic() {
      rollDice();

      setTimeout(() => {
        diceValues.forEach((v, i) => { if (v >= 5) diceKept[i] = true; });
        rollDice();

        setTimeout(() => {
          const counts = {};
          diceValues.forEach(v => counts[v] = (counts[v] || 0) + 1);
          const hasTriple = Object.values(counts).some(c => c >= 3);
          const p = players[activeIndex];

          if (hasTriple) {
            castAbility('ultimate');
          } else if (p.hp < p.maxHp * 0.4 && diceValues.filter(v => v % 2 === 0).length >= 2) {
            castAbility('heal');
          } else {
            castAbility('attack');
          }

          setTimeout(endTurn, 900);
        }, 700);
      }, 700);
    }

    function toggleControls(disabled) {
      document.getElementById('btn-roll').disabled = disabled;
      if (disabled) disableAbilities();
    }

    function disableAbilities() {
      document.querySelectorAll('.ability-btn').forEach(b => b.disabled = true);
    }

    function updateArenaUI() {
      const grid = document.getElementById('arena-grid');
      grid.innerHTML = '';

      players.forEach((p, idx) => {
        const hpPct = (p.hp / p.maxHp) * 100;
        const card = document.createElement('div');
        card.className = `player-card ${idx === activeIndex ? 'active-turn' : ''} ${p.isDead ? 'dead' : ''}`;
        
        card.innerHTML = `
          <h4>${p.name} <small>(${p.type.toUpperCase()})</small></h4>
          <div class="hp-bar-outer">
            <div class="hp-bar-inner" style="width: ${hpPct}%;"></div>
          </div>
          <div style="font-size: 0.85rem;">HP: ${p.hp} / ${p.maxHp}</div>
          ${p.shield > 0 ? `<div class="shield-badge">🛡️ Schild: ${p.shield}</div>` : ''}
        `;
        grid.appendChild(card);
      });
    }

    function writeLog(msg, important = false) {
      const log = document.getElementById('battle-log');
      const line = document.createElement('div');
      line.className = `log-line ${important ? 'important' : ''}`;
      line.innerHTML = msg;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    function checkWinner() {
      const alive = players.filter(p => !p.isDead);

      if (alive.length === 1) {
        const winner = alive[0];
        writeLog(`🏆 **${winner.name} GEWINNT DAS SPIEL!**`, true);
        toggleControls(true);
        document.getElementById('btn-end-turn').disabled = true;

        if (currentMode === 'campaign') {
          if (winner.id === 1) {
            if (campaignLevel < 3) {
              campaignLevel++;
              document.getElementById('campaign-info').innerText = `Level ${campaignLevel} freigeschaltet!`;
              setTimeout(() => {
                alert(`Level geschafft! Weiter zu Level ${campaignLevel}.`);
                switchMode('campaign');
              }, 1200);
            } else {
              alert("🎉 Glückwunsch! Du hast die gesamte Kampagne besiegt!");
            }
          } else {
            alert("Du wurdest besiegt. Versuche es noch einmal!");
          }
        }
        return true;
      }
      return false;
    }
  </script>
</body>
</html>
