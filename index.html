<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch & Dodge</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 { margin: 0 0 5px 0; font-size: 1.5rem; }
    p { margin: 0 0 15px 0; color: #aaa; font-size: 0.9rem; }
    canvas {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      cursor: none;
    }
  </style>
</head>
<body>

  <h1>Catch & Dodge</h1>
  <p>Maus bewegen: Grüne Bälle sammeln, roten ausweichen!</p>
  <canvas id="game" width="400" height="500"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let gameOver = false;
    const player = { x: 200, y: 450, r: 15 };
    const items = [];

    // Steuerung per Mausbewegung
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      player.x = e.clientX - rect.left;
    });

    function spawnItem() {
      const isGood = Math.random() > 0.35;
      items.push({
        x: Math.random() * (canvas.width - 30) + 15,
        y: -10,
        r: isGood ? 10 : 12,
        speed: Math.random() * 2.5 + 2,
        type: isGood ? "good" : "bad"
      });
    }

    setInterval(() => { if (!gameOver) spawnItem(); }, 500);

    function update() {
      if (gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Spieler zeichnen
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fillStyle = "#00adb5";
      ctx.fill();
      ctx.closePath();

      // Objekte aktualisieren & zeichnen
      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.y += item.speed;

        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
        ctx.fillStyle = item.type === "good" ? "#4e9f3d" : "#d83a56";
        ctx.fill();
        ctx.closePath();

        // Kollisionsabfrage
        let dx = player.x - item.x;
        let dy = player.y - item.y;
        let distance = Math.hypot(dx, dy);

        if (distance < player.r + item.r) {
          if (item.type === "good") {
            score += 10;
            items.splice(i, 1);
          } else {
            gameOver = true;
          }
        } else if (item.y > canvas.height + 20) {
          items.splice(i, 1);
        }
      }

      // Score-Anzeige
      ctx.fillStyle = "#fff";
      ctx.font = "16px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Punkte: " + score, 15, 30);

      // Game Over Screen
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 26px sans-serif";
        ctx.fillText("Game Over!", canvas.width / 2, 220);
        
        ctx.font = "18px sans-serif";
        ctx.fillText("Punkte: " + score, canvas.width / 2, 260);

        ctx.fillStyle = "#888";
        ctx.font = "14px sans-serif";
        ctx.fillText("Klicken zum Neustarten", canvas.width / 2, 310);
      } else {
        requestAnimationFrame(update);
      }
    }

    // Neustart per Klick
    canvas.addEventListener("click", () => {
      if (gameOver) {
        score = 0;
        items.length = 0;
        gameOver = false;
        update();
      }
    });

    update();
  </script>
</body>
</html>
